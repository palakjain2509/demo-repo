<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#gradient)"/>
  
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Logo/Brand Area -->
  <rect x="80" y="80" width="120" height="40" rx="8" fill="white" opacity="0.9"/>
  <text x="140" y="105" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#1e40af">MyGETS</text>
  
  <!-- Main Title -->
  <text x="600" y="200" font-family="Arial, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="white">
    OCDS-Native Procurement
  </text>
  <text x="600" y="260" font-family="Arial, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="white">
    Intelligence Platform
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="320" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="white" opacity="0.9">
    Transform procurement data into actionable intelligence
  </text>
  
  <!-- Key Features -->
  <g transform="translate(200, 380)">
    <circle cx="0" cy="0" r="8" fill="white" opacity="0.8"/>
    <text x="20" y="6" font-family="Arial, sans-serif" font-size="18" fill="white">Real-time Risk Detection</text>
  </g>
  
  <g transform="translate(200, 420)">
    <circle cx="0" cy="0" r="8" fill="white" opacity="0.8"/>
    <text x="20" y="6" font-family="Arial, sans-serif" font-size="18" fill="white">Automated Compliance</text>
  </g>
  
  <g transform="translate(200, 460)">
    <circle cx="0" cy="0" r="8" fill="white" opacity="0.8"/>
    <text x="20" y="6" font-family="Arial, sans-serif" font-size="18" fill="white">Predictive Analytics</text>
  </g>
  
  <g transform="translate(600, 380)">
    <circle cx="0" cy="0" r="8" fill="white" opacity="0.8"/>
    <text x="20" y="6" font-family="Arial, sans-serif" font-size="18" fill="white">OCDS Standards</text>
  </g>
  
  <g transform="translate(600, 420)">
    <circle cx="0" cy="0" r="8" fill="white" opacity="0.8"/>
    <text x="20" y="6" font-family="Arial, sans-serif" font-size="18" fill="white">Contract Transparency</text>
  </g>
  
  <g transform="translate(600, 460)">
    <circle cx="0" cy="0" r="8" fill="white" opacity="0.8"/>
    <text x="20" y="6" font-family="Arial, sans-serif" font-size="18" fill="white">Strategic Insights</text>
  </g>
  
  <!-- Website URL -->
  <text x="600" y="550" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="white" opacity="0.8">
    mygets.net
  </text>
  
  <!-- Decorative Elements -->
  <circle cx="1000" cy="150" r="60" fill="white" opacity="0.1"/>
  <circle cx="1050" cy="200" r="40" fill="white" opacity="0.1"/>
  <circle cx="150" cy="500" r="30" fill="white" opacity="0.1"/>
</svg>